<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文學習樂園</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff8ec;color:#2b2b3a}
header{text-align:center;padding:28px 16px 8px}
h1{margin:0;font-size:32px}
.sub{color:#6b6b80;margin-top:6px}
main{max-width:900px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:3px solid var(--c);border-radius:22px;padding:20px;box-shadow:0 5px 0 var(--c);transition:.15s}
a.card:hover{transform:translateY(-3px)}
.e{font-size:56px}
.t{font-size:24px;font-weight:800;color:var(--c);margin:4px 0}
.d{font-size:15px;line-height:1.6}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;margin:8px 4px 0 0}
.order{max-width:900px;margin:8px auto;padding:0 16px 40px;color:#6b6b80;font-size:14px;text-align:center;line-height:1.8}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#ff8a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語樂園">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header>
  <h1>🌈 英文學習樂園</h1>
  <div class="sub">給小1～小4：先會「唸」，再學「記單字」</div>
</header>
<main>
  <a class="card" href="phonics/index.html" style="--c:#27ae60">
    <div class="e">🔤</div>
    <div class="t">自然發音 Phonics</div>
    <div class="d">字母音、短母音、魔術 e、母音組合、R 控制母音…看到字就會唸。8 關・59 課・691 個單字。</div>
    <span class="tag">小1 起步</span><span class="tag">小4 可複習</span>
  </a>
  <a class="card" href="root/index.html" style="--c:#2f80ed">
    <div class="e">🌳</div>
    <div class="t">字根字首字尾</div>
    <div class="d">先學字首字尾，再用字根拆解單字（像 inspect = in＋spect）。難度標 ⭐，可以只看簡單字。</div>
    <span class="tag">小3～小4</span><span class="tag">拆字記單字</span>
  </a>
</main>
<div class="order">
  建議順序：① 自然發音（會唸）→ ② 字首字尾 → ③ 字根（⭐ 簡單字先）<br>
  小1 只做 ①；小4 可以 ① 找弱點複習，同時做 ②③。
</div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});</script>
</body>
</html>
