<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自然發音樂園 Phonics</title>
<style>
:root{--bg:#fffaf0;--ink:#2b2b3a;--sub:#6b6b80;--line:#eadfc8;--hi:#2f80ed;--magic:#b052e0;--ok:#27ae60;--bad:#e74c3c}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
header{padding:16px 16px 4px;text-align:center}
h1{margin:0;font-size:28px;cursor:pointer}
main{max-width:940px;margin:0 auto;padding:8px 16px 70px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 18px;font-size:16px;cursor:pointer;font-weight:700;display:inline-block;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff}
.btn.big{font-size:20px;padding:12px 28px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.legend{text-align:center;font-size:14px;color:var(--sub);margin:6px 0 12px}
/* 地圖 */
.summary{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;text-align:center}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:10px 0}
.guide div{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.stage{margin:22px 0;border-left:10px solid var(--c);padding-left:14px}
.stage h2{margin:0;font-size:22px}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:1px 12px;font-size:13px;margin-left:6px;vertical-align:middle}
.stage .d{color:var(--sub);font-size:14px;margin:2px 0 10px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.les{background:#fff;border:2px solid var(--c);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--c);display:block}
.les:hover{transform:translateY(-2px)}
.les b{display:block;font-size:15px}
.les .st{font-size:14px;margin-top:4px;color:var(--sub)}
/* 課程 */
.box{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 0 var(--line)}
.lt{font-size:26px;font-weight:800;margin:0}
.rule{background:#eef5ff;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:17px;line-height:1.6}
.trick{background:#fff3d6;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:16px;line-height:1.6}
.note{background:#f3f3f7;border-radius:14px;padding:8px 14px;margin:8px 0;font-size:14px;color:var(--sub)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:12px}
.wc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.wc .em{font-size:44px;height:54px}
.wd{font-size:30px;font-weight:800;letter-spacing:1px;min-height:42px}
.wd span{display:inline-block;transition:.2s}
.wd .h{color:var(--hi)}
.wd .s{color:var(--magic);font-style:italic;text-shadow:0 0 8px #e8c9ff;opacity:.9}
.wd .dot{color:#bbb;margin:0 2px}
.wd .on{transform:translateY(-6px) scale(1.25);background:#ffe58a;border-radius:6px}
.ipa{color:var(--sub);font-size:15px}
.zh{font-size:16px;font-weight:700;margin:2px 0}
.snd{display:inline-block;background:var(--hi);color:#fff;border-radius:8px;padding:0 8px;font-size:14px;font-weight:700}
.row{display:flex;gap:6px;justify-content:center;margin-top:6px}
.ib{border:none;background:var(--hi);color:#fff;border-radius:10px;padding:5px 10px;font-size:15px;cursor:pointer;font-weight:700}
.ib.g{background:var(--ok)}.ib.o{background:#e67e22}
.ib:active{transform:scale(.92)}
.demo{background:#fdf0ff;border:2px solid #e8c9ff;border-radius:16px;padding:14px;text-align:center;margin:10px 0}
.demo .dw{font-size:56px;font-weight:800;min-height:72px}
.demo .dw .e{display:inline-block;color:var(--magic);font-style:italic}
@keyframes pop{0%{transform:scale(0) rotate(-90deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.demo .dw .e.new{animation:pop .5s}
.nav{display:flex;justify-content:space-between;margin:14px 0}
/* 練習 */
.q{background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px;text-align:center}
.prog{color:var(--sub);margin-bottom:6px}
.qt{font-size:18px;margin:6px 0}
.qbig{font-size:40px;font-weight:800;margin:8px 0}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px auto;max-width:420px}
.pic{font-size:60px;border:3px solid var(--line);border-radius:18px;background:#fff;cursor:pointer;padding:8px}
.txts{display:grid;gap:10px;margin:14px auto;max-width:420px}
.txt{font-size:28px;font-weight:800;border:3px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;padding:8px}
.pic.ok,.txt.ok{background:#c9f2d3;border-color:var(--ok)}
.pic.no,.txt.no{background:#ffd5d5;border-color:var(--bad)}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0;min-height:56px}
.slot{width:48px;height:56px;border-bottom:4px solid var(--ink);font-size:34px;font-weight:800;cursor:pointer}
.tile{width:52px;height:56px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:30px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tile.used{opacity:.2;pointer-events:none}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}
.fb{min-height:44px;font-size:17px;margin-top:6px}
.res{font-size:60px}
</style>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="theme-color" content="#ff8a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語樂園">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header>
  <a href="../index.html" style="font-size:14px;text-decoration:underline">🏠 回英文學習樂園首頁</a>
  <h1 data-go="#map">🔤 自然發音樂園 Phonics</h1>
  <div class="legend">看到字母 → 想到聲音 → 拼出單字　·　<span style="color:#2f80ed;font-weight:800">藍色</span>＝這課重點　<span style="color:#b052e0;font-weight:800;font-style:italic">紫色</span>＝不發音的魔術／隱形字母　·　🔊 美式發音<br>🎙️ 目前語音：<span id="vname">偵測中…</span></div>
</header>
<main id="app"></main>

<script src="data/stage1-4.js"></script>
<script src="data/stage5-6.js"></script>
<script src="data/stage7-8.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const ST=PH.stages, LES=PH.lessons;
const lesById=Object.fromEntries(LES.map(l=>[l.id,l]));
const strip=s=>s.replace(/[\[\]{}·]/g,'');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const WORDS=LES.flatMap(l=>l.words.map(w=>({m:w[0],w:strip(w[0]),ipa:w[1],zh:w[2],em:w[3],snd:w[4]||'',lid:l.id,stage:l.stage})));
const EMW=WORDS.filter(w=>w.em);

// 進度
let mem={};
function load(){try{return JSON.parse(localStorage.getItem('ph_stars')||'{}')}catch(e){return mem}}
function save(o){mem=o;try{localStorage.setItem('ph_stars',JSON.stringify(o))}catch(e){}}
let stars=load();

// 美式發音
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>x.lang==='en-US'||x.lang==='en_US');voice=v.find(x=>/Natural|Online/i.test(x.name))||v.find(x=>/Aria|Jenny|Samantha|Google US|Zira/i.test(x.name))||v[0]||null}
function showVoice(){const el=document.getElementById('vname');if(el)el.textContent=voice?voice.name+'（'+voice.lang+'）':'找不到美式語音，使用瀏覽器預設（可能不是美式）'}
if('speechSynthesis' in window){pickVoice();showVoice();speechSynthesis.onvoiceschanged=()=>{pickVoice();showVoice()}}
function say(t,rate){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate||.85;speechSynthesis.speak(u)}

// 標記字 → 分段
function chunks(m){
  const out=[],re=/\[([^\]]+)\]|\{([^}]+)\}|([^\[\{]+)/g;let x;
  while((x=re.exec(m))){
    if(x[1])out.push({t:x[1],k:'h'});
    else if(x[2])out.push({t:x[2],k:'s'});
    else for(const ch of x[3])out.push({t:ch,k:ch==='·'?'dot':'n'});
  }
  return out;
}
const wordHtml=m=>chunks(m).map((c,i)=>`<span class="${c.k}" data-i="${i}">${c.t}</span>`).join('');

/* ========== 地圖 ========== */
function totalStars(){return Object.entries(stars).filter(([k])=>lesById[k]).reduce((n,[,v])=>n+v,0)}
function renderMap(){
  app.innerHTML=`
  <div class="summary"><b>🗺️ 學習地圖</b>　共 ${ST.length} 關・${LES.length} 課・${WORDS.length} 個單字　⭐ 已獲得 <b>${totalStars()}</b> / ${LES.length*3}</div>
  <div class="guide">
   <div>👶 <b>小1</b>：第 1 → 4 關（字母音、短母音、雙字母、子音組合）</div>
   <div>🧒 <b>小2</b>：第 5 → 6 關（魔術 e、母音雙胞胎）</div>
   <div>🧑‍🎓 <b>小3~4</b>：第 7 → 8 關。小4 想複習可從第 5 關開始，或先做「全部混合練習」找弱點。</div>
  </div>
  <div class="bar"><a class="btn pri" href="#practice/all">🎮 全部混合練習</a></div>
  ${ST.map(s=>`
  <section class="stage" style="--c:${s.color}">
    <h2>${s.emoji} 第${s.n}關　${s.title}<span class="tag">${s.grade}</span></h2>
    <div class="d">${s.desc}　<a href="#practice/stage-${s.n}" style="text-decoration:underline">🎮 本關混合練習</a></div>
    <div class="lessons">${LES.filter(l=>l.stage===s.n).map(l=>`
      <a class="les" href="#lesson/${l.id}"><b>${l.id}　${l.t}</b><div class="st">${'⭐'.repeat(stars[l.id]||0)||'☆☆☆'}　${l.words.length} 字</div></a>`).join('')}
    </div>
  </section>`).join('')}`;
}

/* ========== 課程 ========== */
function renderLesson(id){
  const l=lesById[id]; if(!l){location.hash='#map';return}
  const i=LES.indexOf(l), prev=LES[i-1], next=LES[i+1], s=ST[l.stage-1];
  app.innerHTML=`
  <div class="bar"><a class="btn" href="#map">🗺️ 地圖</a><a class="btn pri" href="#practice/${id}">🎮 開始練習</a></div>
  <div class="box" style="border-color:${s.color}">
    <div class="legend" style="text-align:left;margin:0">第${s.n}關 ${s.title}　<span class="tag" style="background:${s.color};color:#fff;border-radius:99px;padding:1px 10px">${s.grade}</span></div>
    <h2 class="lt">${l.t}</h2>
    <div class="rule">📘 ${l.rule}</div>
    <div class="trick">💡 ${l.trick}</div>
    ${l.note?`<div class="note">📌 ${l.note}</div>`:''}
    ${l.pairs?`<div class="demo"><div class="legend">🪄 魔法示範：選一個字，按魔杖加上 e</div>
      <div class="dw" id="dw"></div>
      <div class="row"><button class="ib o" id="wand">🪄 揮魔杖</button><button class="ib g" id="nextp">換一組 ➜</button></div></div>`:''}
  </div>
  <div class="words">${l.words.map((w,k)=>`
    <div class="wc" data-k="${k}">
      <div class="em">${w[3]||'📝'}</div>
      <div class="wd">${wordHtml(w[0])}</div>
      <div class="ipa">/${w[1]}/ ${w[4]?`<span class="snd">${w[4]}</span>`:''}</div>
      <div class="zh">${w[2]}</div>
      <div class="row">
        <button class="ib" data-say="${esc(strip(w[0]))}" title="正常速度">🔊</button>
        <button class="ib o" data-say="${esc(strip(w[0]))}" data-slow="1" title="慢速">🐢</button>
        <button class="ib g" data-blend="${k}" title="拆音動畫">▶︎ 拆音</button>
      </div>
    </div>`).join('')}</div>
  <div class="bar" style="margin-top:20px"><a class="btn pri big" href="#practice/${id}">🎮 練習 10 題，拿星星！</a></div>
  <div class="nav">${prev?`<a class="btn" href="#lesson/${prev.id}">⬅ ${prev.id}</a>`:'<span></span>'}${next?`<a class="btn" href="#lesson/${next.id}">${next.id} ➡</a>`:'<span></span>'}</div>`;
  if(l.pairs)initDemo(l);
}
function initDemo(l){
  let pi=0,on=false;
  const dw=$('#dw');
  const draw=(anim)=>{const [a,b]=l.pairs[pi];dw.innerHTML=on?`${a}<span class="e ${anim?'new':''}">${b.slice(a.length)}</span>`:a};
  draw();
  $('#wand').onclick=()=>{on=!on;draw(true);say(on?l.pairs[pi][1]:l.pairs[pi][0],.8)};
  $('#nextp').onclick=()=>{pi=(pi+1)%l.pairs.length;on=false;draw();say(l.pairs[pi][0],.8)};
}
function blend(k,lid){
  const l=lesById[lid]; const m=l.words[k][0];
  const card=document.querySelector(`.wc[data-k="${k}"] .wd`);
  const spans=[...card.querySelectorAll('span')].filter(s=>!s.classList.contains('dot'));
  spans.forEach(s=>s.classList.remove('on'));
  let t=0;
  spans.forEach((s,i)=>{setTimeout(()=>{spans.forEach(x=>x.classList.remove('on'));s.classList.add('on')},i*450)});
  setTimeout(()=>{spans.forEach(x=>x.classList.remove('on'));say(strip(m),.8)},spans.length*450);
}

/* ========== 練習 ========== */
let Q=null;
const uniq=a=>{const s=new Set();return a.filter(x=>!s.has(x.w)&&s.add(x.w))};
function pool(scope){
  if(scope==='all')return uniq(WORDS);
  if(scope.startsWith('stage-'))return uniq(WORDS.filter(w=>w.stage==scope.slice(6)));
  return uniq(WORDS.filter(w=>w.lid===scope));
}
function startPractice(scope){
  const p=pool(scope); if(!p.length){location.hash='#map';return}
  const picked=shuffle(p).slice(0,10);
  Q={scope,p,list:picked,i:0,score:0};
  nextQ();
}
function types(w){
  const t=['L2W'];
  if(w.em){t.push('L2P','R2P');if(w.w.length<=9)t.push('SP','SP')}
  else if(w.w.length<=9)t.push('SP');
  return t;
}
function nextQ(){
  if(Q.i>=Q.list.length)return finish();
  const w=Q.list[Q.i], type=shuffle(types(w))[0];
  const back=lessonBack();
  const head=`<div class="bar"><a class="btn" href="${back}">⬅ 離開</a></div><div class="q"><div class="prog">第 ${Q.i+1} / ${Q.list.length} 題　得分 ${Q.score}</div>`;
  if(type==='L2P'||type==='R2P'){
    const others=shuffle(Q.p.filter(x=>x.em&&x.em!==w.em)).slice(0,3);
    const fill=shuffle(EMW.filter(x=>x.em!==w.em&&!others.includes(x))).slice(0,3-others.length);
    const opts=shuffle([w,...others,...fill]);
    app.innerHTML=head+(type==='L2P'
      ?`<div class="qt">👂 聽聽看，是哪一個？</div><button class="ib big" style="font-size:36px;padding:10px 24px" data-say="${esc(w.w)}">🔊</button>`
      :`<div class="qt">👀 這個字是哪一個？</div><div class="qbig">${w.w}</div>`)+
      `<div class="pics">${opts.map(o=>`<button class="pic" data-a="${esc(o.w)}">${o.em}</button>`).join('')}</div><div class="fb" id="fb"></div><button class="btn pri" id="nx" style="display:none">下一題 ➜</button></div>`;
    if(type==='L2P')say(w.w);
    bindChoice(w,'.pic');
  }else if(type==='L2W'){
    const others=shuffle(Q.p.filter(x=>x.w!==w.w&&x.w[0]!==undefined)).slice(0,3);
    const fill=shuffle(WORDS.filter(x=>x.w!==w.w&&!others.includes(x))).slice(0,3-others.length);
    const opts=shuffle([w,...others,...fill]);
    app.innerHTML=head+`<div class="qt">👂 聽聽看，哪一個字？</div><button class="ib" style="font-size:36px;padding:10px 24px" data-say="${esc(w.w)}">🔊</button>
      <div class="txts">${opts.map(o=>`<button class="txt" data-a="${esc(o.w)}">${o.w}</button>`).join('')}</div><div class="fb" id="fb"></div><button class="btn pri" id="nx" style="display:none">下一題 ➜</button></div>`;
    say(w.w);bindChoice(w,'.txt');
  }else{
    const letters=w.w.replace(/\s/g,'').split('');
    const tiles=shuffle(letters.map((c,k)=>({c,k})));
    app.innerHTML=head+`<div class="qt">✏️ 聽聽看，把字母拼起來！</div><div class="qbig" style="margin:0">${w.em||''}</div>
      <div class="zh">${w.zh}</div><button class="ib" style="font-size:30px" data-say="${esc(w.w)}">🔊</button>
      <div class="slots" id="slots"></div><div class="tiles" id="tiles">${tiles.map(t=>`<button class="tile" data-k="${t.k}">${t.c}</button>`).join('')}</div>
      <div class="row"><button class="ib o" id="undo">⌫ 退回</button></div>
      <div class="fb" id="fb"></div><button class="btn pri" id="nx" style="display:none">下一題 ➜</button></div>`;
    say(w.w);bindSpell(w,letters);
  }
}
function lessonBack(){return Q.scope==='all'||Q.scope.startsWith('stage-')?'#map':`#lesson/${Q.scope}`}
function mark(ok,w){
  if(ok)Q.score++;
  $('#fb').innerHTML=ok?`🎉 答對了！<b>${w.w}</b> /${w.ipa}/ ${w.zh}`:`答案是 <b>${w.w}</b> /${w.ipa}/ ${w.zh}，再聽一次～`;
  say(w.w);
  const nx=$('#nx');nx.style.display='inline-block';nx.onclick=()=>{Q.i++;nextQ()};
}
function bindChoice(w,sel){
  let done=false;
  app.querySelectorAll(sel).forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const ok=b.dataset.a===w.w;
    b.classList.add(ok?'ok':'no');
    if(!ok)app.querySelectorAll(sel).forEach(x=>{if(x.dataset.a===w.w)x.classList.add('ok')});
    mark(ok,w);
  });
}
function bindSpell(w,letters){
  let ans=[],done=false;
  const slots=$('#slots');
  const draw=()=>{slots.innerHTML=letters.map((_,i)=>`<button class="slot" data-i="${i}">${ans[i]?ans[i].c:''}</button>`).join('');
    app.querySelectorAll('.tile').forEach(t=>t.classList.toggle('used',ans.some(a=>a.k==t.dataset.k)))};
  draw();
  const check=()=>{
    done=true;
    const ok=ans.map(a=>a.c).join('')===letters.join('');
    if(!ok)slots.classList.add('shake');
    mark(ok,w);
  };
  app.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    if(done||ans.length>=letters.length)return;
    ans.push({c:t.textContent,k:t.dataset.k});draw();if(ans.length===letters.length)check();
  });
  $('#undo').onclick=()=>{if(done)return;ans.pop();draw()};
}
function finish(){
  const n=Q.list.length, s=Q.score, r=s/n;
  const st=r>=.9?3:r>=.7?2:r>=.5?1:0;
  if(lesById[Q.scope]){stars[Q.scope]=Math.max(stars[Q.scope]||0,st);save(stars)}
  app.innerHTML=`<div class="q"><div class="res">${st===3?'🏆':st===2?'🎉':st===1?'👍':'💪'}</div>
    <div class="qbig">${s} / ${n}</div><div class="res" style="font-size:44px">${'⭐'.repeat(st)||'☆'}</div>
    <div class="fb">${st===3?'太厲害了！':st>=1?'不錯喔，再練習會更好！':'沒關係，回去看一下規則再來挑戰！'}</div>
    <div class="bar"><a class="btn pri" href="#practice/${Q.scope}" id="again">🔁 再玩一次</a><a class="btn" href="${lessonBack()}">📘 回課程</a><a class="btn" href="#map">🗺️ 地圖</a></div></div>`;
  $('#again').onclick=e=>{e.preventDefault();startPractice(Q.scope)};
}

/* ========== 路由與事件 ========== */
let curLesson=null;
function route(){
  const [v,a]=(location.hash||'#map').slice(1).split('/');
  window.scrollTo(0,0);
  if(v==='lesson'){curLesson=a;renderLesson(a)}
  else if(v==='practice')startPractice(a||'all');
  else renderMap();
}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-say],[data-blend],[data-go]');
  if(!t)return;
  if(t.dataset.go){location.hash=t.dataset.go;return}
  if(t.dataset.say){say(t.dataset.say,t.dataset.slow?.45:.85);return}
  if(t.dataset.blend!==undefined)blend(+t.dataset.blend,curLesson);
});
route();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('../../sw.js').catch(()=>{});</script>
</body>
